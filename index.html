<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mfumo wa Shule</title>
    <style>
        body{ font-family: serif; margin:0; padding:10px; background:#f0f0f0; }
        .container{ max-width:1000px; margin:auto; }
        
        /* ====================================== NAVIGATION BAR ====================================== */
        .navbar{ display:flex; flex-wrap:wrap; background:#b5c7de; border:1px solid #7a7a7a; position:sticky; top:0; z-index:1000; }
        .nav-item, .dropdown{ flex:1 1 auto; position:relative; text-align:center; border-right:2px solid #b5c7de; }
        .navbar > *:last-child{ border-right:none; }
        .nav-link{ display:block; padding:10px 5px; text-decoration:none; background:#d9ead3; color:black; font-size:18px; cursor:pointer; }
        .nav-link:hover{ background:#c2d6bc; }
        
        /* ====================================== DROPDOWN ====================================== */
        .dropdown-content{ display:none; position:absolute; top:100%; left:0; min-width:220px; background:#e8f4e5; border:1px solid #7a7a7a; box-shadow:0 8px 16px rgba(0,0,0,0.2); z-index:999; }
        .dropdown-content a{ display:block; padding:10px 15px; text-decoration:none; color:black; text-align:left; border-bottom:1px solid #b5c7de; font-size:16px; }
        .dropdown-content a:last-child{ border-bottom:none; }
        .dropdown-content a:hover{ background:#b5c7de; }

        /* 1. MABADILIKO KUBWA: Menu inafunguliwa na Class ya .open kwenye simu na PC */
        .dropdown.open .dropdown-content { display: block; }
        
        /* 2. MABADILIKO KUBWA: Tunaweka :hover ifanye kazi Kwenye PC pekee! (Inazuia Sticky Hover kwenye simu) */
        @media (min-width: 601px) {
            .dropdown:hover .dropdown-content { display: block; }
        }
        
        .dropdown.force-hide .dropdown-content { display: none !important; }

        /* ====================================== MAIN BODY ====================================== */
        .main-wrapper{ display:flex; margin-top:-1px; }
        /* ====================================== SIDEBAR ====================================== */
        .sidebar{ width:max-content; white-space:nowrap; background:#e8f4e5; border:2px solid #333; border-right:none; padding:15px; box-sizing:border-box; }
        .sidebar h3{ margin-top:0; font-size:18px; border-bottom:2px solid #b5c7de; padding-bottom:5px; }
        .sidebar a{ display:block; padding:10px 5px; text-decoration:none; color:black; border-bottom:1px dashed #999; font-size:16px; }
        .sidebar a:hover{ background:#d9ead3; }
        /* ====================================== CONTENT AREA ====================================== */
        .content-frame{ flex:1; min-height:700px; border:2px solid #333; background:#cfe2f3; overflow:hidden; }
        #main_frame{ width:100%; height:700px; border:none; background:white; }
        
        /* ====================================== MOBILE RESPONSIVE ====================================== */
        @media(max-width:600px){
            body{ padding:0; } /* Punguza margin mazingira yawe safi */
            
            /* 'position: static' inaruhusu menu ya ndani kuisoma navbar yote na kujaa kwenye kioo */
            .nav-item, .dropdown{ flex:1 1 30%; border-bottom:2px solid #b5c7de; position: static; } 
            .navbar > *:nth-child(3n){ border-right:none; }
            .nav-link{ font-size:16px; }
            .main-wrapper{ flex-direction:column; }
            .sidebar{ display: none; }
            .content-frame{ height:85vh; border:none; border-top: 2px solid #333; }
            #main_frame{ height:100%; }
            
            /* 3. MABADILIKO KUBWA: Hii inafanya menu ishuke nzuri, ijae kioo, na isiharibu umbo la menu zingine */
            .dropdown-content { 
                position: absolute; 
                top: 100%; 
                left: 0; 
                width: 100%; 
                box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- ====================================== NAVBAR ====================================== -->

        <div class="nav-item">
            <a href="#" onclick="loadPage('https://umawanjo.ac.tz/njombe', this); return false;" class="nav-link"> Home </a>

        <div class="dropdown" onclick="toggleDropdown(this, event)">
            <a href="#" class="nav-link"> Usajili </a>
            <div class="dropdown-content">
                <a href="#" onclick="loadPage('https://umawanjo.ac.tz/njombe/maelekezo_mfumo.html', this); return false;"> Usajili </a>
                <a href="#" onclick="loadPage('https://umawanjo.ac.tz/dira.php', this); return false;"> Dira na Dhima </a>
                <a href="#" onclick="loadPage('https://umawanjo.ac.tz/uongozi.php', this); return false;"> Uongozi </a>
            </div>
        </div>
        <div class="dropdown" onclick="toggleDropdown(this, event)">
            <a href="#" class="nav-link"> Matokeo </a>
            <div class="dropdown-content">
                <a href="#" onclick="loadPage('https://umawanjo.ac.tz/njombe/results.php', this); return false;"> Matokeo </a>
                <a href="#" onclick="loadPage('https://umawanjo.ac.tz/ludewa/private/results.php', this); return false;"> Matokeo PC </a>
            </div>
        </div>
        <div class="dropdown" onclick="toggleDropdown(this, event)">
            <a href="#" class="nav-link"> Academic </a>
            <div class="dropdown-content">
                <a href="#" onclick="loadPage('https://umawanjo.ac.tz/njombe/calenda.php', this); return false;"> Kalenda </a>
                <a href="#" onclick="loadPage('https://umawanjo.ac.tz/njombe/missing_percentage_sheet.php', this); return false;"> Missing Data </a>
                <a href="#" onclick="loadPage('https://umawanjo.ac.tz/njombe/missing_subjects_sheet.php', this); return false;"> Missing Subjects </a>
                <a href="#" onclick="loadPage('https://umawanjo.ac.tz/njombe/control_sheet.php', this); return false;"> Control Sheet </a>
                <a href="#" onclick="loadPage('https://umawanjo.ac.tz/njombe/sheet.php', this); return false;"> Raw Data </a>
                <a href="#" onclick="loadPage('https://umawanjo.ac.tz/njombe/score_sheet.php', this); return false;"> Score Sheet </a>
            </div>
        </div>
        <div class="dropdown" onclick="toggleDropdown(this, event)">
            <a href="#" class="nav-link"> Report </a>
            <div class="dropdown-content">
                <a href="#" onclick="loadPage('https://umawanjo.ac.tz/njombe/exam_id.php', this); return false;"> Report </a>

    </nav>

        <!-- CONTENT AREA -->
        <div class="content-frame">
            <iframe id="main_frame" src="https://umawanjo.ac.tz/njombe"> </iframe>
        </div>
    </div>
</div>

<script>
// ZUIA MENU KURUDI YENYEWE KWENYE KOMPYUTA (MOUSE LEAVE FIX)
document.querySelectorAll('.dropdown').forEach(drop => {
    drop.addEventListener('mouseleave', function() {
        this.classList.remove('force-hide');
    });
});

function toggleDropdown(element, event) {
    // Tunahakikisha anayebonyezwa ni kiungo kikuu pekee cha nje (siyo links za ndani)
    if (event.target.classList.contains('nav-link')) {
        // Hii inazuia ukurasa kuruka na kurudi juu ukibonyeza link ya kwenye simu na PC
        event.preventDefault(); 
        
        if (window.innerWidth <= 600) {
            // Funga menyu nyingine zote kwanza
            document.querySelectorAll('.dropdown').forEach(drop => {
                if (drop !== element) drop.classList.remove('open');
            });
            // Toggles (Fungua au funga) menyu uliyoibonyeza
            element.classList.toggle('open');
        }
    }
}

function loadPage(pageUrl, element){
    const externalPages = [ 'login.php', 'results.php', 'results_pc.php', 'exam_id.php', 'exam_id_pc.php', 'missing_percentage_sheet.php', 'missing_subjects_sheet.php', 'control_sheet.php', 'sheet.php', 'score_sheet.php' ];
    const shouldOpenExternally = externalPages.some(page => pageUrl.includes(page) );
    
    if(shouldOpenExternally){
        window.open(pageUrl, '_blank');
    } else {
        document.getElementById('main_frame').src = pageUrl;
    }

    // FUNGA MENU MARA MOJA BAADA YA MTUMIAJI KUCHAGUA LINK
    document.querySelectorAll('.dropdown').forEach(drop => {
        drop.classList.remove('open'); // Kwenye simu, hii itafunga menu moja kwa moja!
        drop.classList.add('force-hide'); // Inaficha kwa nguvu kwenye PC
    });

    // Backup ya PC endapo mouse haitasogezwa
    setTimeout(() => {
        document.querySelectorAll('.dropdown').forEach(drop => {
            drop.classList.remove('force-hide');
        });
    }, 1000);
}

// FUNGA MENU MTUMIAJI AKIBONYEZA ENEO LINGINE LOLOTE NJE YA MENU (KWENYE SIMU)
window.onclick = function(event) {
    if (!event.target.matches('.nav-link') && !event.target.closest('.dropdown-content')) {
        document.querySelectorAll('.dropdown').forEach(drop => {
            drop.classList.remove('open');
        });
    }
}
</script>
