<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Web Interface - Fixed Nav & Sidebar</title>
    <style>
        body {
            font-family: serif;
            margin: 0;
            padding: 10px;
            background-color: #f0f0f0;
        }

        .container {
            max-width: 1000px; 
            margin: auto;
        }

        /* =========================================
           MPANGILIO WA NAVIGATION BAR (FIXED TOP)
           ========================================= */
        .navbar {
            display: flex;
            background-color: #b5c7de;
            border: 1px solid #7a7a7a;
            padding: 0;
            margin-bottom: 0;
            flex-wrap: wrap;
            position: sticky;
            top: 0;
            z-index: 100; 
        }

        .nav-item, .dropdown {
            flex: 1 1 auto;
            text-align: center;
            border-right: 2px solid #b5c7de;
            box-sizing: border-box;
        }

        .navbar > *:last-child {
            border-right: none;
        }

        .nav-link {
            display: block;
            padding: 10px 5px;
            text-decoration: none;
            color: black;
            background-color: #d9ead3;
            font-size: 18px;
            width: 100%;
            box-sizing: border-box;
        }

        .nav-item:hover .nav-link, .dropdown:hover .nav-link {
            background-color: #c2d6bc; 
        }

        /* =========================================
           MPANGILIO WA DROPDOWN
           ========================================= */
        .dropdown {
            position: relative;
        }

        .dropdown-content {
            display: none; 
            position: absolute;
            top: 100%; 
            left: 0;
            background-color: #e8f4e5;
            min-width: 160px; 
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.3);
            z-index: 10; 
            border: 1px solid #7a7a7a;
        }

        .dropdown-content a {
            color: black;
            padding: 10px 15px;
            text-decoration: none;
            display: block;
            text-align: left;
            font-size: 16px;
            border-bottom: 1px solid #b5c7de;
        }

        .dropdown-content a:last-child {
            border-bottom: none;
        }

        .dropdown-content a:hover {
            background-color: #b5c7de; 
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        /* =========================================
           MPANGILIO WA MWILI (SIDEBAR + IFRAME)
           ========================================= */
        .main-wrapper {
            display: flex;
            flex-direction: row; 
            margin-top: -1px; 
        }

        .sidebar {
            width: max-content; /* Inafanya upana ulingane na neno refu zaidi */
            white-space: nowrap; /* Inazuia maneno kukatika na kushuka chini */
            background-color: #e8f4e5;
            border: 2px solid #333;
            border-right: none; 
            padding: 15px;
            box-sizing: border-box;
        }

        .sidebar h3 {
            margin-top: 0;
            font-size: 18px;
            border-bottom: 2px solid #b5c7de;
            padding-bottom: 5px;
        }

        .sidebar a {
            display: block;
            padding: 10px 5px;
            text-decoration: none;
            color: black;
            border-bottom: 1px dashed #999;
            font-size: 16px;
        }

        .sidebar a:hover {
            background-color: #d9ead3;
        }

        .content-frame {
            flex: 1; 
            width: 100%;
            height: 600px;
            border: 2px solid #333;
            background-color: #cfe2f3;
            box-sizing: border-box;
        }

        /* =========================================
           MABADILIKO KWA AJILI YA SIMU (RESPONSIVE)
           ========================================= */
        @media (max-width: 600px) {
            body {
                padding: 5px;
            }
            .nav-item, .dropdown {
                flex: 1 1 30%; 
                border-bottom: 2px solid #b5c7de;
            }
            .navbar > *:nth-child(3n) {
                border-right: none; 
            }
            .nav-link {
                font-size: 16px;
            }
            .main-wrapper {
                flex-direction: column;
            }
            
            /* Tunaficha sidebar na iframe kwenye simu */
            .sidebar, .content-frame {
                display: none; 
            }
        }
    </style>
</head>
<body>

<div class="container">

        <div class="nav-item">

            <div class="dropdown-content">

                <a href="vision.html" target="myFrame" class="iframe-link">Dira na Dhima</a>

            <div class="dropdown-content">
                <a href="https://umawanjo.ac.tz/njombe/results.php" target="myFrame" class="iframe-link">Programu/Kozi</a>
                <a href="https://umawanjo.ac.tz/njombe/results.php" target="myFrame" class="iframe-link">Matokeo</a>

        <div class="dropdown">

        <iframe name="myFrame" srcdoc="<h2 style='font-family:serif; padding:15px; font-size: 18px; line-height: 1.5;'>Karibu! Chagua menu ya juu kuona taarifa zake hapa. Link za upande wa kushoto zitafungua ukurasa mpya.</h2>" class="content-frame">
        </iframe>

</div>

<script>
    // 1. Kazi ya kuondoa iframe kwenye simu na kuiacha kwenye PC
    function adjustLinksForMobile() {
        const links = document.querySelectorAll('.iframe-link');
        if (window.innerWidth <= 600) {
            links.forEach(link => {
                link.removeAttribute('target');
            });
        } else {
            links.forEach(link => {
                link.setAttribute('target', 'myFrame');
            });
        }
    }
    window.addEventListener('DOMContentLoaded', adjustLinksForMobile);
    window.addEventListener('resize', adjustLinksForMobile);

    // 2. Kazi ya Kuficha Dropdown mara baada ya kubofya link ndani yake
    const dropdownLinks = document.querySelectorAll('.dropdown-content a');
    dropdownLinks.forEach(link => {
        link.addEventListener('click', function() {
            // Tafuta boksi la dropdown linaloshikilia hii link
            const dropdownContent = this.parentElement;
            
            // Ficha kwa nguvu kwa kutumia CSS ya ndani (inline CSS)
            dropdownContent.style.display = 'none';
            
            // Subiri nusu sekunde (500ms) kisha rudisha uwezo wa CSS kuonyesha tena ukileta mouse
            setTimeout(() => {
                dropdownContent.style.display = '';
            }, 500);
        });
    });
</script>

</body>
</html>
