<script>

    function loadPage(pageUrl){

        /*
        ==========================================
        PAGES ZITAKAZOFUNGUKA NJE YA IFRAME
        ==========================================
        */

        const externalPages = [

            'login.php',
            'results.php',
            'results_pc.php',
            'exam_id.php',
            'exam_id_pc.php',
            
            // Tumeongeza hizi kurasa za Academic hapa chini
            'missing_percentage_sheet.php',
            'missing_subjects_sheet.php',
            'control_sheet.php',
            'sheet.php',
            'score_sheet.php'

        ];

        /*
        ==========================================
        KAGUA KAMA URL IPO KWENYE LIST
        ==========================================
        */

        const shouldOpenExternally = externalPages.some(page =>
            pageUrl.includes(page)
        );

        /*
        ==========================================
        FUNGUA NJE YA IFRAME
        ==========================================
        */

        if(shouldOpenExternally){

            window.open(pageUrl, '_blank');

        }

        /*
        ==========================================
        FUNGUA NDANI YA IFRAME
        ==========================================
        */

        else{

            document.getElementById('main_frame').src = pageUrl;

        }

    }

</script>
